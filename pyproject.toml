[project]
name = "hospedaplus-f3-db"
version = "1.0.0"
description = "HospedaPlus F3 booking-engine database: schema, reproducible seed and integrity checks "
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "tzdata",  # time zone database; Windows doesn't ship one
]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["seed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
