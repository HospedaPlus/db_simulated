# CI: GitHub runs this on its own machines every time someone pushes
# or opens a pull request. If any step fails, the run turns red.
# Results show up in the repo's "Actions" tab.
name: ci

# When to run: on every push (any branch) and on every pull request.
on:
  push:
  pull_request:

jobs:
  # A job is a list of steps that run in order on one machine.
  # We only have one for now: run the tests.
  test:
    # A fresh Linux machine, borrowed from GitHub and thrown away at the end.
    # That's why we don't need a .venv here: the whole machine is isolated.
    runs-on: ubuntu-latest

    # A throwaway PostgreSQL 16 next to the job, so the database tests
    # (reservar(), 50 concurrent buyers, penalties...) run too.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hospedaplus
          POSTGRES_PASSWORD: hospedaplus
          POSTGRES_DB: hospedaplus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hospedaplus"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://hospedaplus:hospedaplus@localhost:5432/hospedaplus_test

    steps:
      # 1. Download our repo into the machine (it starts empty).
      - uses: actions/checkout@v4

      # 2. Install Python 3.12. "uses" = a ready-made action someone else wrote.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install the project and the test tools listed in pyproject.toml.
      #    "run" = a normal terminal command, same as on your laptop.
      - name: Install dependencies
        run: pip install -e ".[test]"

      # 4. Run every test, unit and database ones (TEST_DATABASE_URL above).
      - name: Run tests
        run: pytest -v